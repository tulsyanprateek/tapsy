<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F7FB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tapsy</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<script>
(function(){var d=document.documentElement;try{var t=localStorage.getItem("xp_theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.setAttribute("data-theme",t);var h=localStorage.getItem("xp_hue");if(h)d.style.setProperty("--h",h)}catch(e){d.setAttribute("data-theme","light")}})();
</script>
<style>
@font-face{font-family:'Outfit';font-weight:300 800;font-display:swap;src:url('./fonts/outfit.woff2') format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:400 800;font-display:swap;src:url('./fonts/hanken-grotesk.woff2') format('woff2')}

/* Material You style tones, all from one accent hue (--h, picked in Settings). */
:root{
  --h:250;
  --f-d:'Outfit',system-ui,sans-serif;--f-b:'Hanken Grotesk',system-ui,sans-serif;
  --p:hsl(var(--h) 52% 46%);--on-p:#fff;
  --pc:hsl(var(--h) 85% 91%);--on-pc:hsl(var(--h) 60% 20%);
  --bg:hsl(var(--h) 30% 98%);
  --s1:hsl(var(--h) 28% 95.5%);--s2:hsl(var(--h) 24% 92.5%);--s3:hsl(var(--h) 20% 88.5%);
  --t1:hsl(var(--h) 14% 12%);--t2:hsl(var(--h) 8% 34%);--t3:hsl(var(--h) 6% 52%);
  --line:hsl(var(--h) 16% 87%);
  --exp:#D3453B;--inc:#23935A;--warn:#C27C00;
  --inv:hsl(var(--h) 12% 18%);--on-inv:hsl(var(--h) 30% 95%);
  --ci-mix:20%;
  --sh:0 12px 32px hsla(var(--h),30%,20%,.16);
  --r:22px;--nav-h:76px;
  color-scheme:light;
}
[data-theme="dark"]{
  --p:hsl(var(--h) 78% 78%);--on-p:hsl(var(--h) 60% 16%);
  --pc:hsl(var(--h) 32% 27%);--on-pc:hsl(var(--h) 85% 90%);
  --bg:hsl(var(--h) 10% 7%);
  --s1:hsl(var(--h) 9% 11%);--s2:hsl(var(--h) 9% 15%);--s3:hsl(var(--h) 9% 20%);
  --t1:hsl(var(--h) 18% 93%);--t2:hsl(var(--h) 8% 72%);--t3:hsl(var(--h) 6% 54%);
  --line:hsl(var(--h) 8% 21%);
  --exp:#FF8A7E;--inc:#6BD39A;--warn:#F2B24C;
  --inv:hsl(var(--h) 20% 90%);--on-inv:hsl(var(--h) 14% 14%);
  --ci-mix:30%;
  --sh:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f-b);font-size:15px;line-height:1.45;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
[hidden]{display:none!important}
.i{width:24px;height:24px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:20px;height:20px}
.num{font-variant-numeric:tabular-nums}

/* ── layout: bottom bar on phones, sidebar on wide screens ── */
.app{display:flex;height:100vh;height:100dvh}
.side{display:none}
.page{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.wrap{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--s1);display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px;justify-content:center;color:var(--t2);font-size:12px;font-weight:600}
.bn .pill{width:64px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.bn.on{color:var(--t1)}
.bn.on .pill{background:var(--pc);color:var(--on-pc)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:41;width:60px;height:60px;border-radius:18px;
  background:var(--pc);color:var(--on-pc);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);transition:transform .12s}
.fab .i{width:30px;height:30px;stroke-width:2.4}
.fab:active{transform:scale(.92)}
@media (min-width:960px){
  .bnav,.fab{display:none}
  .side{display:flex;flex-direction:column;width:256px;flex:0 0 256px;background:var(--s1);padding:calc(18px + env(safe-area-inset-top)) 12px 14px;gap:2px;overflow-y:auto}
  .side-b{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--f-d);font-weight:700;font-size:20px}
  .side-b img{width:34px;height:34px;border-radius:10px}
  .xfab{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-radius:18px;background:var(--pc);color:var(--on-pc);
    font-family:var(--f-d);font-weight:600;font-size:15px;margin-bottom:14px;box-shadow:0 2px 6px hsla(var(--h),30%,20%,.12)}
  .sn{display:flex;align-items:center;gap:14px;height:52px;padding:0 18px;border-radius:99px;color:var(--t2);font-weight:600;font-size:14.5px}
  .sn:hover{background:var(--s2)}
  .sn.on{background:var(--pc);color:var(--on-pc)}
  .side-g{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:16px 18px 6px}
  .side-f{margin-top:auto;padding:12px 10px 0}
  .wrap{padding:28px 32px 60px}
  .only-phone{display:none!important}
}

/* ── page header ── */
.ph{display:flex;align-items:center;gap:8px;min-height:56px;margin-bottom:10px}
.ph-t{flex:1;min-width:0}
.ph-t h1{font-family:var(--f-d);font-weight:700;font-size:32px;letter-spacing:-.6px;line-height:1.1}
.ph-t .ph-s{color:var(--t2);font-size:14px;margin-bottom:2px}
.ib{width:44px;height:44px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);position:relative;flex:0 0 auto}
.ib:hover{background:var(--s2)}
.ib.tonal{background:var(--s2)}
.sdot{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);background:var(--t3)}
.sdot.ok{background:var(--inc)} .sdot.busy{background:var(--warn);animation:pulse 1.1s infinite} .sdot.err{background:var(--exp)}
@keyframes pulse{50%{opacity:.3}}

/* ── building blocks ── */
.card{background:var(--s1);border-radius:var(--r)}
.pad{padding:16px 18px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec h2{font-family:var(--f-d);font-weight:700;font-size:19px;letter-spacing:-.2px}
.tbtn{min-height:40px;padding:0 14px;border-radius:99px;color:var(--p);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.tbtn:hover{background:var(--s2)}
.ci{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;
  background:color-mix(in srgb,var(--c,#888) var(--ci-mix),var(--s1));color:var(--c,#888)}
.ci.sm{width:34px;height:34px;flex-basis:34px;font-size:17px}
.ci.lg{width:56px;height:56px;flex-basis:56px;font-size:28px}
.exp{color:var(--exp)!important}
.inc{color:var(--inc)!important}
.muted{color:var(--t3)}
.small{font-size:13px}
.note{color:var(--t2);font-size:13px;line-height:1.5;margin:12px 6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;
  font-weight:600;font-size:14px;color:var(--t2);white-space:nowrap;background:var(--bg)}
.chip.on{background:var(--pc);border-color:transparent;color:var(--on-pc)}
.chip .i{width:18px;height:18px}

.seg{display:flex;background:var(--s2);border-radius:99px;padding:4px;gap:2px}
.seg button{flex:1;height:38px;padding:0 14px;border-radius:99px;font-weight:700;font-size:14px;color:var(--t2);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--t1);box-shadow:0 1px 3px hsla(var(--h),30%,20%,.15)}
[data-theme="dark"] .seg button.on{background:var(--s3)}

.btn{min-height:46px;padding:0 20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--f-d);font-weight:600;font-size:15px;background:var(--s2);color:var(--t1);white-space:nowrap}
.btn.pri{background:var(--p);color:var(--on-p)}
.btn.ton{background:var(--pc);color:var(--on-pc)}
.btn.danger{color:var(--exp)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* account cards (home) */
.accs{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.accs::-webkit-scrollbar{display:none}
.ac{flex:0 0 auto;min-width:138px;padding:12px 16px;border-radius:18px;background:var(--s1);border:2px solid transparent;text-align:left}
.ac.on{border-color:var(--p);background:var(--pc);color:var(--on-pc)}
.ac .an{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:inherit;opacity:.85;white-space:nowrap}
.ac .ab{font-family:var(--f-d);font-weight:700;font-size:18px;margin-top:2px;white-space:nowrap}
@media (min-width:960px){.accs{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap}}

/* income / expense tiles */
.ie{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ie .card{padding:14px 16px;display:flex;gap:12px;align-items:center;text-align:left}
.ie .arr{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ie .arr.e{background:color-mix(in srgb,var(--exp) 16%,transparent);color:var(--exp)}
.ie .arr.n{background:color-mix(in srgb,var(--inc) 16%,transparent);color:var(--inc)}
.ie .l{font-size:13px;color:var(--t2);font-weight:600}
.ie .v{font-family:var(--f-d);font-weight:700;font-size:20px;letter-spacing:-.3px;white-space:nowrap}
.ie .c{font-size:12px;color:var(--t3)}
.ie>*{min-width:0}
.ie .card>div{min-width:0}
.ie .v{overflow:hidden;text-overflow:ellipsis}

/* spending line (home) */
.lc{padding:16px 18px 14px}
.lc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lc-h .t{font-size:13px;color:var(--t2);font-weight:600}
.lc-h .v{font-family:var(--f-d);font-weight:700;font-size:26px;letter-spacing:-.5px}
.lc-h .d{font-size:13px;color:var(--t2);margin-top:2px}
.lc-legend{display:flex;gap:12px;font-size:12px;color:var(--t2);white-space:nowrap}
.lc-legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--p);vertical-align:3px;margin-right:5px}
.lc-legend i.prev{border-top:2px dashed var(--t3)}
.lplot{position:relative;height:150px;margin-top:12px}
.lplot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lplot .ylab{position:absolute;left:0;font-size:11px;color:var(--t3);padding-top:2px}
.lplot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.lplot .base{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--line)}
.lplot .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--p);border:2.5px solid var(--s1);transform:translate(-50%,50%)}
.lplot .xh{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--t3);pointer-events:none}
.lplot .hit{position:absolute;inset:0;cursor:crosshair;touch-action:pan-y}
.xlabs{position:relative;height:16px;margin-top:4px;font-size:11px;color:var(--t3)}
.xlabs span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* transactions */
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 8px 8px;font-weight:700;font-size:14px;color:var(--t2)}
.dh span:last-child{font-weight:600;font-size:13px;color:var(--t3)}
.grp{background:var(--s1);border-radius:var(--r);overflow:hidden}
.ti{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:10px 16px;text-align:left;transition:background .15s}
.ti:hover{background:var(--s2)}
.ti+.ti{border-top:1px solid var(--line)}
.ti-m{flex:1;min-width:0}
.ti-t{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-s{display:block;font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ti-a{font-family:var(--f-d);font-weight:600;font-size:16px;white-space:nowrap;text-align:right}
.ti-a.trf{color:var(--t2)}
.ti-a small{display:block;font-family:var(--f-b);font-weight:500;font-size:12px;color:var(--t3)}
.empty{padding:36px 22px;text-align:center;color:var(--t2);line-height:1.55}
.empty .ee{font-size:40px;margin-bottom:8px}
.empty b{color:var(--t1)}
.mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px 4px}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:0 0 auto;height:40px;padding:0 16px;border-radius:99px;font-weight:700;font-size:14px;color:var(--t2);white-space:nowrap}
.mtabs button.on{background:var(--p);color:var(--on-p)}
@media (min-width:960px){.mtabs{margin:0 0 10px;padding:2px 0 4px}}
.sbar{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 16px;border-radius:99px;background:var(--s2);margin-bottom:10px}
.sbar input{flex:1;min-width:0;height:100%;border:0;background:none;font-size:16px;outline:none}
.tots{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.tot{flex:1 1 140px;padding:10px 14px;border-radius:16px;background:var(--s1)}   /* phones: two per row, so full amounts fit */
.tot .l{font-size:12px;color:var(--t2);font-weight:600}
.tot .v{font-family:var(--f-d);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* budgets */
.bc{display:block;width:100%;padding:16px 18px;text-align:left;margin-bottom:10px}
.bc-h{display:flex;align-items:center;gap:12px}
.bc-h .m{flex:1;min-width:0}
.bc-t{font-family:var(--f-d);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-s{font-size:13px;color:var(--t2)}
.bc-r{text-align:right}
.bc-r b{display:block;font-family:var(--f-d);font-size:20px;white-space:nowrap}
.bc-r small{font-size:12px;color:var(--t3)}
.bb{position:relative;height:14px;border-radius:99px;background:var(--s3);margin:14px 0 8px}
.bb i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c,var(--p))}
.bb .today{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--t1);transform:translateX(-50%);opacity:.75}
.bc-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--t2)}
.bc-f b{color:var(--t1)}
.addcard{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:var(--r);border:2px dashed var(--line);color:var(--t2);font-weight:700}
.addcard:hover{background:var(--s1)}

/* reports */
.donut{display:flex;align-items:center;justify-content:center;position:relative;padding:8px 0 4px}
.donut svg{width:210px;height:210px;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut .mid b{font-family:var(--f-d);font-size:24px;letter-spacing:-.4px}
.donut .mid span{font-size:12.5px;color:var(--t2)}
.donut circle.seg{cursor:pointer;transition:opacity .15s}
.donut svg:hover circle.seg{opacity:.55}
.donut svg circle.seg:hover{opacity:1}
.cl{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;text-align:left;border-radius:16px}
.cl:hover{background:var(--s2)}
.cl .m{flex:1;min-width:0}
.cl .r1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px}
.cl .r1 span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .r1 span:last-child{font-family:var(--f-d);font-weight:600;white-space:nowrap}
.cl .r2{display:flex;align-items:center;gap:10px;margin-top:5px}
.cl .tr{flex:1;height:7px;border-radius:99px;background:var(--s3);overflow:hidden}
.cl .tr i{display:block;height:100%;border-radius:99px;background:var(--c)}
.cl .pc{font-size:12px;color:var(--t3);min-width:34px;text-align:right}
.chart{padding:16px 18px 14px}
.ch-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch-h .t{font-family:var(--f-d);font-weight:700;font-size:17px}
.ch-h .s{font-size:12.5px;color:var(--t3)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.plot{display:flex;gap:8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--t3);text-align:right;min-width:34px}
.pa{flex:1;min-width:0;position:relative;border-bottom:1px solid var(--line)}
.pa .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.pa .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--t3)}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.col i{display:block;flex:1;max-width:26px;border-radius:4px 4px 0 0;background:var(--p)}
.col:hover i{opacity:.8}
.col i.inc{background:var(--inc)}
.col i.exp{background:var(--exp)}
.xax{display:flex;gap:2px;margin-left:42px;margin-top:4px;font-size:10.5px;color:var(--t3)}
.xax span{flex:1;min-width:0;text-align:center;white-space:nowrap}
.tip{position:fixed;z-index:400;pointer-events:none;background:var(--inv);color:var(--on-inv);padding:7px 11px;border-radius:10px;
  font-size:12.5px;line-height:1.4;box-shadow:var(--sh);white-space:pre;transform:translate(-50%,-100%)}
.tip.below{transform:translate(-50%,8px)}

/* lists (accounts, categories, settings, more) */
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;text-align:left}
.li:hover{background:var(--s2)}
.li+.li{border-top:1px solid var(--line)}
.li .m{flex:1;min-width:0}
.li .t{display:block;font-weight:700;font-size:15px}
.li .s{display:block;font-size:13px;color:var(--t3);line-height:1.4}
.li .r{font-family:var(--f-d);font-weight:600;font-size:16px;white-space:nowrap}
.li .chev{color:var(--t3)}
.li.sub{padding-left:40px;min-height:54px}
.li.sub.add{min-height:46px;color:var(--p);gap:10px}
.li.sub.add .s{color:var(--p);font-weight:700}
.subh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 2px}
.li .lic{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--p)}
.lst{background:var(--s1);border-radius:var(--r);overflow:hidden}
.hues{display:flex;flex-wrap:wrap;gap:8px}

.msg{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13.5px;background:var(--s2)}

.steps{color:var(--t2);font-size:13.5px;line-height:1.6;padding:14px 16px;border-radius:16px;background:var(--s2);margin-top:14px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="page" id="page"><div class="wrap" id="view"></div></main>
</div>
<nav class="bnav" id="bnav" aria-label="Main"></nav>

<div id="layer"></div>
<div class="tip" id="tip" hidden></div>
<datalist id="noteList"></datalist>

<script>
(function(){
"use strict";
/* ═══════════════ helpers ═══════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const now = () => Date.now();
const uid = () => now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const pdate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pdate(s); d.setDate(d.getDate() + n); return iso(d); };
const daysIn = key => { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const thisYear = () => new Date().getFullYear();
function dayLabel(s){
  const t = today();
  if (s === t) return "Today";
  if (s === addDays(t, -1)) return "Yesterday";
  const d = pdate(s);
  return d.toLocaleDateString("en-IN", d.getFullYear() === thisYear() ? {weekday:"long", day:"numeric", month:"long"} : {day:"numeric", month:"short", year:"numeric"});
}
const ago = t => { if (!t) return "never"; const m = Math.max(0, Math.round((now() - t) / 60000));
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.floor(m / 60) + " h ago" : Math.floor(m / 1440) + " d ago"; };

let P = Object.assign({cur:"₹", lastAcc:"", name:""}, LS.get("xp_prefs", {}));
const savePrefs = () => LS.set("xp_prefs", P);
function money(n, sign){
  const a = Math.abs(n || 0);
  const s = a.toLocaleString("en-IN", {minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2});
  return (n < 0 ? "−" : sign && n > 0 ? "+" : "") + P.cur + s;
}
function short(n){
  const a = Math.abs(n || 0); let s;
  const f = (v, big) => (big ? Math.round(v) : Math.round(v * 10) / 10).toString();
  if (a >= 1e7) s = f(a / 1e7, a >= 1e8) + "Cr";
  else if (a >= 1e5) s = f(a / 1e5, a >= 1e6) + "L";
  else if (a >= 1e3) s = f(a / 1e3, a >= 1e4) + "k";
  else s = String(Math.round(a));
  return (n < 0 ? "−" : "") + P.cur + s;
}
function niceMax(v){
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e;
}

/* icons (24px line icons) */
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  budget:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  more:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  chart:'<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  wallet:'<path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6"/><path d="M16.5 14h.01"/>',
  tag:'<path d="M3 12.6V4a1 1 0 0 1 1-1h8.6l8.4 8.4a1.4 1.4 0 0 1 0 2L13.4 21a1.4 1.4 0 0 1-2 0z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  settings:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  cloud:'<path d="M7 19a5 5 0 1 1 1.1-9.9A6 6 0 0 1 19.6 11 4 4 0 0 1 18 19z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  up:'<path d="M7 17 17 7M9 7h8v8"/>',
  down:'<path d="M17 7 7 17M7 9v8h8"/>',
  trf:'<path d="M17 3l4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/>',
  bk:'<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M12 9l6 6M18 9l-6 6"/>',
  check:'<path d="M5 12.5 10 17.5 19 7"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  chevl:'<path d="M15 5l-7 7 7 7"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  ul:'<path d="M12 15V4M7 9l5-5 5 5M5 20h14"/>',
  sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',
  x:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
};
const ic = (n, cls) => `<svg class="i${cls ? " " + cls : ""}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n] || ""}</svg>`;

/* ═══════════════ local store (IndexedDB; localStorage if IndexedDB is blocked) ═══════════════ */
const Store = {
  db:null, mem:false,
  async init(){
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("xp", 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("rec", {keyPath:"id"}); d.createObjectStore("meta", {keyPath:"k"}); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
      });
    } catch(e){ this.mem = true; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  },
  tx(name, mode, fn){
    return new Promise((res, rej) => {
      const t = this.db.transaction(name, mode), out = fn(t.objectStore(name));
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async all(){ if (this.mem) return LS.get("xp_rec", []); return (await this.tx("rec", "readonly", s => s.getAll())).result || []; },
  async put(recs){
    if (!recs.length) return;
    if (this.mem) { const m = new Map(LS.get("xp_rec", []).map(r => [r.id, r])); recs.forEach(r => m.set(r.id, r)); LS.set("xp_rec", [...m.values()]); return; }
    await this.tx("rec", "readwrite", s => { recs.forEach(r => s.put(r)); });
  },
  async meta(k, d){ if (this.mem) return LS.get("xp_m_" + k, d); const r = (await this.tx("meta", "readonly", s => s.get(k))).result; return r ? r.v : d; },
  async setMeta(k, v){ if (this.mem) return LS.set("xp_m_" + k, v); await this.tx("meta", "readwrite", s => s.put({k, v})); },
  async wipe(){
    if (this.mem) { Object.keys(localStorage).filter(k => k.startsWith("xp_")).forEach(k => LS.del(k)); return; }
    await this.tx("rec", "readwrite", s => s.clear()); await this.tx("meta", "readwrite", s => s.clear());
  }
};

/* ═══════════════ data ═══════════════
   Every record: {id, kind, upd (ms of last change), del (1 = deleted, kept so the delete syncs), ...}
   kind acc {name, icon, open}  ·  cat {name, icon, color, type:'exp'|'inc'}  ·  bud {cat ('' = all spending), amt}
   txn {type:'exp'|'inc'|'trf', amt, date 'YYYY-MM-DD', cat, acc, to (transfer), note, at (created ms)} */
const R = new Map();
let dirty = new Set();
const COLORS = ["#E5484D","#F76B15","#F5A524","#8DB600","#30A46C","#12A594","#00A2C7","#0090FF","#5B5BD6","#8E4EC6","#D6409F","#A07553"];
const DEFAULTS = [
  ["acc","a_cash","Cash","💵"],["acc","a_bank","Bank","🏦"],["acc","a_card","Credit card","💳"],
  ["exp","c_food","Food","🍔",1],["exp","c_groc","Groceries","🛒",4],["exp","c_fuel","Fuel","⛽",2],["exp","c_trav","Travel","🚕",7],
  ["exp","c_shop","Shopping","🛍️",10],["exp","c_bill","Bills","🧾",6],["exp","c_rent","Rent","🏠",11],["exp","c_hlth","Health","💊",5],
  ["exp","c_fun","Entertainment","🎬",9],["exp","c_edu","Education","📚",8],["exp","c_gift","Gifts","🎁",2],["exp","c_fam","Family","👪",3],
  ["exp","c_care","Personal care","💇",10],["exp","c_home","Household","🧹",11],["exp","c_othe","Other","📦",8],
  ["inc","c_sal","Salary","💼",4],["inc","c_biz","Business","🏢",7],["inc","c_int","Interest","📈",5],["inc","c_rfd","Refund","↩️",6],
  ["inc","c_gin","Gift received","🎁",2],["inc","c_othi","Other income","💰",3]
];
function seedDefaults(){
  // fixed ids + upd 0: every new device makes the same records, so they merge instead of doubling on sync
  const out = [];
  DEFAULTS.forEach(([t, id, name, icon, col], i) => {
    if (R.has(id)) return;
    const r = t === "acc" ? {id, kind:"acc", name, icon, open:0, ord:i, upd:0, del:0}
                          : {id, kind:"cat", type:t, name, icon, color:COLORS[col], ord:i, upd:0, del:0};
    R.set(id, r); out.push(r);
  });
  return Store.put(out);
}
const live = kind => { const o = []; for (const r of R.values()) if (r.kind === kind && !r.del) o.push(r); return o; };
const byOrd = (a, b) => (a.ord || 0) - (b.ord || 0) || a.name.localeCompare(b.name);
const accounts = () => live("acc").sort(byOrd);
const cats = type => live("cat").filter(c => c.type === type && !c.parent).sort(byOrd);   // main categories (sub-categories come from Cashew)
const txnSort = (a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || 0) - (a.at || 0);
const txns = () => live("txn").sort(txnSort);
const inRange = (list, a, b) => list.filter(t => t.date >= a && t.date <= b);
const nameOf = id => { const r = R.get(id); return r ? r.name : "—"; };
const iconOf = id => { const r = R.get(id); return r ? r.icon : "❔"; };
const colOf = id => { const r = R.get(id); if (r && r.color) return r.color; let h = 0; String(id).split("").forEach(c => h = (h * 31 + c.charCodeAt(0)) >>> 0); return COLORS[h % COLORS.length]; };
const ci = (id, cls) => `<span class="ci${cls ? " " + cls : ""}" style="--c:${colOf(id)}">${iconOf(id)}</span>`;
// xt = Cashew's borrowed / lent / balance-correction entries: they move the balance but are not income or spending
const is = (t, type) => t.type === type && !t.xt;
const sumType = (list, type) => list.reduce((s, t) => s + (is(t, type) ? t.amt : 0), 0);
const catLabel = t => nameOf(t.cat) + (t.sub && R.get(t.sub) ? " › " + nameOf(t.sub) : "");
const XT = {debt:"Borrowed", credit:"Lent", adj:"Correction"};
function balances(){
  const b = {};
  live("acc").forEach(a => b[a.id] = +a.open || 0);
  live("txn").forEach(t => {
    if (t.type === "exp" && t.acc in b) b[t.acc] -= t.amt;
    if (t.type === "inc" && t.acc in b) b[t.acc] += t.amt;
    if (t.type === "trf") { if (t.acc in b) b[t.acc] -= t.amt; if (t.to in b) b[t.to] += t.amt; }
  });
  return b;
}

async function save(recs){
  const t = now();
  recs.forEach(r => {
    const old = R.get(r.id);
    r.upd = Math.max(t, old ? (old.upd || 0) + 1 : 0);
    r.del = r.del ? 1 : 0;
    R.set(r.id, r); dirty.add(r.id);
  });
  await Store.put(recs);
  await Store.setMeta("dirty", [...dirty]);
  Sync.soon();
  render();
}
const remove = rec => save([Object.assign({}, rec, {del:1})]);

/* ═══════════════ periods ═══════════════ */
const curMonth = () => today().slice(0, 7);
function perRange(p){
  if (p.mode === "year") return [p.key + "-01-01", p.key + "-12-31"];
  return [p.key + "-01", p.key + "-" + pad(daysIn(p.key))];
}
function perLabel(p){
  if (p.mode === "year") return p.key;
  const [y, m] = p.key.split("-").map(Number);
  return y === thisYear() ? MONTH[m - 1] : MON[m - 1] + " " + y;
}
function perShift(p, n){
  if (p.mode === "year") return {mode:"year", key:String(+p.key + n)};
  const [y, m] = p.key.split("-").map(Number), d = new Date(y, m - 1 + n, 1);
  return {mode:"month", key:d.getFullYear() + "-" + pad(d.getMonth() + 1)};
}
function perDaysSoFar(p){      // days of the period that have happened (for "per day" averages)
  const [a, b] = perRange(p), t = today();
  if (a > t) return 0;
  return Math.round((pdate(b < t ? b : t) - pdate(a)) / 864e5) + 1;
}

/* ═══════════════ sync: your own Google Sheet via Apps Script (expense_backend.gs) ═══════════════
   Push every changed record, pull everything the sheet got since our cursor. Same record wins
   by newest upd, so the phone and the PC can both work offline and meet in the middle. */
const Sync = {
  cfg: LS.get("xp_sync", null), busy:false, err:"", last:0, cursor:0, timer:null,
  soon(ms){ clearTimeout(this.timer); if (this.cfg) this.timer = setTimeout(() => this.run(), ms || 1500); },
  async post(body){
    let lastErr;
    for (const wait of [0, 3000]) {          // Google's redirect hop fails now and then: one retry
      if (wait) await new Promise(r => setTimeout(r, wait));
      try { const r = await fetch(this.cfg.url, {method:"POST", body:JSON.stringify(body)}); return await r.json(); }
      catch(e){ lastErr = e; }
    }
    throw lastErr;
  },
  async run(){
    if (!this.cfg || this.busy) return;
    if (!navigator.onLine) { this.err = "offline"; paintStatus(); return; }
    this.busy = true; paintStatus();
    const ids = [...dirty], snap = {};
    try {
      const changes = ids.map(id => { const r = R.get(id); if (!r) return null; snap[id] = r.upd;
        return {id, kind:r.kind, upd:r.upd, del:r.del ? 1 : 0, data:JSON.stringify(r), view:sheetView(r)}; }).filter(Boolean);
      const res = await this.post({action:"sync", key:this.cfg.key, since:this.cursor, changes});
      if (!res || !res.ok) throw new Error((res && res.error) || "No reply from the sheet");
      const put = [];
      (res.changes || []).forEach(c => {
        let d; try { d = JSON.parse(c.data); } catch(e){ return; }
        d.id = c.id; d.upd = Number(c.upd) || 0; d.del = c.del ? 1 : 0;
        const l = R.get(c.id);
        if (l && (l.upd || 0) >= d.upd) return;
        R.set(c.id, d); put.push(d);
      });
      await Store.put(put);
      const got = new Set(put.map(p => p.id));
      ids.forEach(id => { const r = R.get(id); if (!r || r.upd === snap[id] || got.has(id)) dirty.delete(id); });
      this.cursor = res.now || this.cursor; this.last = now(); this.err = "";
      await Store.setMeta("cursor", this.cursor); await Store.setMeta("dirty", [...dirty]); await Store.setMeta("lastSync", this.last);
      if (put.length) render();
    } catch(e){ this.err = String((e && e.message) || e); }
    this.busy = false; paintStatus();
    if (!this.err && dirty.size && ids.length) this.soon(800);   // something changed while we were syncing
  }
};
function sheetView(r){
  if (r.kind === "txn") return {date:r.date, type:{exp:"Expense", inc:"Income", trf:"Transfer"}[r.type] || r.type, amount:r.amt,
    category:r.type === "trf" ? "" : nameOf(r.cat), account:r.type === "trf" ? nameOf(r.acc) + " → " + nameOf(r.to) : nameOf(r.acc), note:r.note || ""};
  if (r.kind === "cat") return {type:r.type === "inc" ? "Income" : "Expense", category:r.name};
  if (r.kind === "acc") return {account:r.name, amount:+r.open || 0};
  if (r.kind === "bud") return {category:r.cat ? nameOf(r.cat) : "All spending", amount:r.amt, type:"Budget"};
  return {};
}
function syncState(){
  if (!Sync.cfg) return {cls:"", text:"On this device only"};
  if (Sync.busy) return {cls:"busy", text:"Syncing…"};
  if (Sync.err === "offline") return {cls:"err", text:"Offline" + (dirty.size ? " · " + dirty.size + " to sync" : "")};
  if (Sync.err) return {cls:"err", text:"Sync failed · tap to retry"};
  return {cls:"ok", text:"Synced " + ago(Sync.last) + (dirty.size ? " · " + dirty.size + " waiting" : "")};
}
function paintStatus(){
  const s = syncState();
  document.querySelectorAll(".sdot").forEach(d => d.className = "sdot " + s.cls);
  document.querySelectorAll("[data-synctext]").forEach(d => d.textContent = s.text);
  document.querySelectorAll('[data-a="syncTap"]').forEach(b => b.title = s.text + (Sync.err && Sync.err !== "offline" ? ": " + Sync.err : ""));
  const sc = $("syncCard"); if (sc && !sc.contains(document.activeElement)) sc.outerHTML = syncCard();
}

function spendLine(acc){
  // cumulative spending this month vs last month by the same day
  const key = curMonth(), n = daysIn(key), prevKey = perShift({mode:"month", key}, -1).key, pn = daysIn(prevKey);
  const tday = +today().slice(8);
  const cum = (k, len) => { const d = new Array(len + 1).fill(0);
    live("txn").forEach(t => { if (is(t, "exp") && t.date.slice(0, 7) === k && (!acc || t.acc === acc)) d[+t.date.slice(8)] += t.amt; });
    for (let i = 1; i <= len; i++) d[i] += d[i - 1]; return d; };
  const cur = cum(key, n), prev = cum(prevKey, pn);
  const max = niceMax(Math.max(1, cur[tday], prev[pn]));
  const X = d => (d - 1) / (n - 1) * 100, Y = v => 100 - v / max * 100;
  const pts = (arr, upto) => { let s = ""; for (let d = 1; d <= upto; d++) s += (d === 1 ? "M" : "L") + X(d).toFixed(2) + " " + Y(arr[d]).toFixed(2) + " "; return s; };
  const curPath = pts(cur, tday);
  const prevPath = pts(prev, Math.min(pn, n));
  const area = curPath + `L${X(tday).toFixed(2)} 100 L0 100 Z`;
  const delta = cur[tday] - prev[Math.min(tday, pn)];
  const xl = [1, 10, 20, n].map(d => `<span style="left:${X(d)}%">${d === 1 ? "1 " + MON[+key.slice(5) - 1] : d}</span>`).join("");
  return {html:`<div class="card lc">
    <div class="lc-h"><div><div class="t">Spent this month</div><div class="v num">${money(cur[tday])}</div>
      <div class="d">${prev[pn] ? (delta > 0 ? `<span class="exp">${money(delta)} more</span>` : `<span class="inc">${money(-delta)} less</span>`) + " than last month by today" : "Nothing to compare with last month yet"}</div></div>
      <div class="lc-legend"><span><i></i>${MON[+key.slice(5) - 1]}</span><span><i class="prev"></i>${MON[+prevKey.slice(5) - 1]}</span></div></div>
    <div class="lplot" id="lplot">
      <div class="gl" style="top:0"></div><div class="gl" style="top:50%"></div><div class="base"></div>
      <span class="ylab" style="top:0">${short(max)}</span><span class="ylab" style="top:50%">${short(max / 2)}</span>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p)" stop-opacity=".28"/><stop offset="1" stop-color="var(--p)" stop-opacity="0"/></linearGradient></defs>
        <path d="${prevPath}" fill="none" stroke="var(--t3)" stroke-width="2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
        <path d="${area}" fill="url(#lg)" stroke="none"/>
        <path d="${curPath}" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="dot" style="left:${X(tday)}%;bottom:${100 - Y(cur[tday])}%"></span>
      <div class="xh" id="lxh" hidden></div>
      <div class="hit" id="lhit"></div>
    </div>
    <div class="xlabs">${xl}</div></div>`, data:{cur, prev, n, pn, tday, key, prevKey, X}};
}

function budCard(bd, spent, p){
  const [a, b] = perRange(p), isNow = p.key === curMonth(), n = daysIn(p.key);
  const left = bd.amt - spent, pct = Math.min(100, bd.amt ? spent / bd.amt * 100 : 0);
  const dl = isNow ? n - +today().slice(8) + 1 : 0;
  const todayPct = isNow ? (+today().slice(8) - .5) / n * 100 : p.key < curMonth() ? 100 : 0;
  const c = bd.cat ? colOf(bd.cat) : "var(--p)";
  const title = bd.cat ? nameOf(bd.cat) : "Monthly budget";
  const ahead = isNow && spent / bd.amt * 100 > todayPct + 5;
  return `<button class="card bc" data-a="budEdit" data-id="${bd.id}">
    <div class="bc-h">${bd.cat ? ci(bd.cat) : `<span class="ci" style="--c:var(--p)">${ic("budget", "s")}</span>`}
      <div class="m"><div class="bc-t">${esc(title)}</div><div class="bc-s num">${money(spent)} of ${money(bd.amt)}</div></div>
      <div class="bc-r">${left >= 0 ? `<b class="num">${money(left)}</b><small>left</small>` : `<b class="num exp">${money(-left)}</b><small>over</small>`}</div></div>
    <div class="bb" style="--c:${left < 0 ? "var(--exp)" : c}"><i style="width:${pct.toFixed(1)}%"></i>${isNow ? `<span class="today" style="left:${todayPct.toFixed(1)}%" title="Today"></span>` : ""}</div>
    <div class="bc-f"><span>${isNow ? `${dl} day${dl === 1 ? "" : "s"} left` : esc(perLabel(p))}${ahead ? ` · <span class="exp">spending ahead of pace</span>` : ""}</span>
      <span>${isNow && left > 0 ? `<b class="num">${money(Math.floor(left / dl))}</b>/day` : ""}</span></div></button>`;
}
function vBudgets(){
  if (V.per.mode !== "month") V.per = {mode:"month", key:curMonth()};

/* ── Reports ── */
function colChart({cols, avg, height}){
  // cols: [{x (axis label or ''), tip, vals:[{v, cls}]}]
  const max = niceMax(Math.max(1, ...cols.flatMap(c => c.vals.map(v => v.v))));
  const h = height || 150;
  return `<div class="plot"><div class="yax" style="height:${h}px"><span>${short(max)}</span><span>${short(max / 2)}</span><span>0</span></div>` +
    `<div class="pa" style="height:${h}px"><div class="gl" style="top:0"></div><div class="gl" style="top:50%"></div>` +
    (avg ? `<div class="avg" style="bottom:${Math.min(100, avg / max * 100).toFixed(1)}%"></div>` : "") +
    `<div class="cols">${cols.map(c => `<div class="col" data-tip="${esc(c.tip)}">${c.vals.map(v =>
      `<i class="${v.cls || ""}" style="height:${(v.v / max * 100).toFixed(2)}%"></i>`).join("")}</div>`).join("")}</div></div></div>` +
    `<div class="xax">${cols.map(c => `<span>${esc(c.x)}</span>`).join("")}</div>`;
}
function donut(rows, tot, label){
  // top 7 categories in their own colours, the rest folded into "Other"
  const top = rows.slice(0, 7), rest = rows.slice(7).reduce((s, r) => s + r[1], 0);
  const segs = top.map(([id, v]) => ({id, v, c:colOf(id), name:nameOf(id)}));
  if (rest > 0) segs.push({id:"", v:rest, c:"var(--t3)", name:"Other"});
  const r = 40, C = 2 * Math.PI * r, gap = segs.length > 1 ? 1.4 : 0;
  let off = 0;
  const arcs = segs.map(s => { const len = s.v / tot * C, d = Math.max(0.01, len - gap);
    const out = `<circle class="seg" cx="50" cy="50" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${d.toFixed(2)} ${(C - d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      data-tip="${esc(s.name + "\n" + money(s.v) + " · " + Math.round(s.v / tot * 100) + "%")}" ${s.id ? `data-a="catTx" data-id="${esc(s.id)}"` : ""}></circle>`;
    off += len; return out; }).join("");
  return `<div class="donut"><svg viewBox="0 0 100 100">${arcs}</svg><div class="mid"><b class="num">${short(tot)}</b><span>${label}</span></div></div>`;
}
function vReports(){
  const p = V.per, [a, b] = perRange(p), all = txns(), list = inRange(all, a, b);

  list.forEach(t => { if (is(t, typ)) by[t.cat] = (by[t.cat] || 0) + t.amt; });
  const rows = Object.entries(by).sort((x, y) => y[1] - x[1]), tTot = typ === "exp" ? spent : inc;
  const maxRow = rows.length ? rows[0][1] : 1;
  let cols = [];

    const n = daysIn(p.key), d0 = {};
    list.forEach(t => { if (is(t, typ)) d0[t.date] = (d0[t.date] || 0) + t.amt; });
    for (let d = 1; d <= n; d++) { const k = p.key + "-" + pad(d), v = d0[k] || 0;
      cols.push({x:d === 1 || d % 5 === 0 ? String(d) : "", tip:dayLabel(k) + "\n" + money(v), vals:[{v}]}); }
  } else {
    const m0 = {};
    list.forEach(t => { if (is(t, typ)) { const m = t.date.slice(5, 7); m0[m] = (m0[m] || 0) + t.amt; } });
    for (let m = 1; m <= 12; m++) { const v = m0[pad(m)] || 0; cols.push({x:MON[m - 1].slice(0, 1), tip:MONTH[m - 1] + " " + p.key + "\n" + money(v), vals:[{v}]}); }
  }

  const mk = [];

  const cmp = mk.map(k => { const [y, m] = k.split("-").map(Number);
    return {x:p.mode === "month" ? MON[m - 1] : MON[m - 1].slice(0, 1), tip:MONTH[m - 1] + " " + y + "\nIncome " + money(agg[k].inc) + "\nSpent  " + money(agg[k].exp),
      vals:[{v:agg[k].inc, cls:"inc"}, {v:agg[k].exp, cls:"exp"}]}; });
  return header("Reports", "", "", true) + `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <div class="seg" style="flex:0 0 auto">${["month","year"].map(m => `<button data-a="perMode" data-m="${m}" class="${p.mode === m ? "on" : ""}">${m === "month" ? "Month" : "Year"}</button>`).join("")}</div>
      <div style="display:flex;align-items:center;gap:2px;margin-left:auto"><button class="ib" data-a="per" data-n="-1" aria-label="Previous">${ic("chevl")}</button>
        <b style="font-family:var(--f-d);font-size:16px;min-width:110px;text-align:center">${esc(perLabel(p))}</b><button class="ib" data-a="per" data-n="1" aria-label="Next">${ic("chev")}</button></div>
    </div>
    <div class="tots"><div class="tot"><div class="l">Expense</div><div class="v exp num">${money(spent)}</div></div>
      <div class="tot"><div class="l">Income</div><div class="v inc num">${money(inc)}</div></div>
      <div class="tot"><div class="l">Net</div><div class="v num">${money(inc - spent, true)}</div></div></div>
    <div class="seg" style="margin-top:16px">${[["exp","Spending"],["inc","Income"]].map(([k, l]) => `<button data-a="rType" data-k="${k}" class="${typ === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="card" style="margin-top:12px;padding:8px 0 10px">
      ${rows.length ? donut(rows, tTot, tName.toLowerCase()) + rows.map(([id, v]) => `<button class="cl" data-a="catTx" data-id="${esc(id)}" style="--c:${colOf(id)}">${ci(id)}
        <span class="m"><span class="r1"><span>${esc(nameOf(id))}</span><span class="num">${money(v)}</span></span>
        <span class="r2"><span class="tr"><i style="width:${(v / maxRow * 100).toFixed(1)}%"></i></span><span class="pc">${Math.round(v / tTot * 100)}%</span></span></span></button>`).join("")
      : emptyBox("📊", "Nothing in this period yet.")}
    </div>

}

/* ═══════════════ modal layer (each sheet is a history entry, so the phone's back button closes it) ═══════════════ */
const Modal = {
  stack:[],
  open(html, opts){
    const ov = document.createElement("div");
    ov.className = "ov"; ov.innerHTML = html;
    ov.addEventListener("pointerdown", e => { ov._down = e.target === ov; });
    ov.addEventListener("click", e => { if (e.target === ov && ov._down && !(opts && opts.sticky)) Modal.close(); });
    $("layer").appendChild(ov);
    this.stack.push({ov, onClose:opts && opts.onClose});
    history.pushState({m:this.stack.length}, "");
    return ov;
  },
  close(){ if (this.stack.length) history.back(); },
  _pop(){ const t = this.stack.pop(); if (t) { t.ov.remove(); if (t.onClose) t.onClose(); } closeMenu(); tip.hidden = true; }
};
window.addEventListener("popstate", e => {
  const depth = (e.state && e.state.m) || 0;
  while (Modal.stack.length > depth) Modal._pop();
});
function ask(text, ok, danger){
  return new Promise(res => {
    let val = false;
    const ov = Modal.open(`<div class="sheet"><div class="grab"></div><div class="sh-body" style="padding-top:18px;font-size:16px;line-height:1.55">${text}</div>
      <div class="sh-foot"><button class="btn" data-a="mClose">Cancel</button><button class="btn ${danger ? "danger" : "pri"}" id="askOk" style="${danger ? "background:color-mix(in srgb,var(--exp) 14%,transparent)" : ""}">${esc(ok)}</button></div></div>`,
      {onClose:() => res(val)});
    ov.querySelector("#askOk").onclick = () => { val = true; Modal.close(); };
  });
}
let snackT;
function snack(msg, acts){

async function cwApply(P2, skipDupes, dropStarters, fileName){
  const t = now(), out = [], created = [], prev = [];
  const put = (next, old) => {
    next.upd = Math.max(t, old ? (old.upd || 0) + 1 : 0);
    if (next.cw) next.cwAt = next.upd;
    next.del = next.del ? 1 : 0;
    if (old) prev.push(old); else created.push(next.id);
    out.push(next);
  };
  P2.acc.forEach(x => put(x.next, x.prev));
  P2.cat.forEach(x => put(x.next, x.prev));
  P2.add.forEach(r => put(r));
  if (!skipDupes) P2.dupes.forEach(d => put(d.rec));
  P2.upd.forEach(x => put(x.next, x.prev));
  P2.del.forEach(e => put(Object.assign({}, e, {del:1}), e));
  if (dropStarters) P2.starters.forEach(s => { const n = Object.assign({}, s, {del:1}); put(n, s); delete n.cwAt; });
  out.forEach(r => { R.set(r.id, r); dirty.add(r.id); });
  await Store.put(out);
  await Store.setMeta("dirty", [...dirty]);
  lastImport = {at:t, file:fileName, src:P2.N.src, created, prev};
  await Store.setMeta("lastImport", lastImport);
  // make the account Cashew used most the default for new entries
  const cnt = {}; live("txn").forEach(x => { if (x.cw) cnt[x.acc] = (cnt[x.acc] || 0) + 1; });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (top && (!R.get(P.lastAcc) || R.get(P.lastAcc).del || dropStarters)) { P.lastAcc = top[0]; savePrefs(); }
  Sync.soon(); render();
  return cwVerify(P2, skipDupes, out.length);
}
// read back what is stored and check it against the file, account by account
function cwVerify(P2, skipDupes, written){
  const part = cwPart(P2, R, skipDupes);
  const accs = P2.N.wallets.map(w => Object.assign({name:w.name}, part[w.key]));
  const found = accs.reduce((s, a) => s + a.n, 0);
  const expected = P2.N.txns.filter(t => t.paid && P2.accOf[t.wallet]).length - (skipDupes ? P2.dupes.length : 0);
  // no Cashew transaction may exist twice: per (second, account, type, amount), never more here than in the file
  const key = (sec, acc, type, amt) => sec + "|" + acc + "|" + type + "|" + amt, inFile = new Map(), here = new Map(); let twice = 0;
  const skip = new Set(skipDupes ? P2.dupes.map(d => d.rec.cw) : []);
  P2.N.txns.forEach(t => { if (t.paid && P2.accOf[t.wallet] && !skip.has(t.key)) { const k = key(Math.floor(t.ms / 1000), P2.accOf[t.wallet], t.income ? "inc" : "exp", r2(Math.abs(t.amount))); inFile.set(k, (inFile.get(k) || 0) + 1); } });
  live("txn").forEach(r => { if (r.cw) { const k = key(Math.floor((r.at || 0) / 1000), r.acc, r.type, r.amt); here.set(k, (here.get(k) || 0) + 1); } });
  here.forEach((n, k) => { if (inFile.has(k) && n > inFile.get(k)) twice += n - inFile.get(k); });
  return {found, expected, twice, kept:P2.kept, written, dupesSkipped:skipDupes ? P2.dupes.length : 0, accs,
    ok:accs.every(a => a.file === a.here) && found === expected && !twice};
}
function cwResult(res){
  Modal.open(`<div class="sheet"><div class="grab"></div><div class="sh-top"><div class="tt">${res.ok ? "Imported ✓" : "Imported, with differences"}</div><button class="ib" data-a="mClose" aria-label="Close">${ic("close")}</button></div>
    <div class="sh-body">
      <p style="margin:0 4px 10px">${res.found} Cashew transactions are in this app now${res.dupesSkipped ? `, ${res.dupesSkipped} skipped as already typed here` : ""}${res.kept ? `, ${res.kept} kept as you changed them here` : ""}.</p>
      <div class="lst">${res.accs.map(a => `<div class="li"><span class="m"><span class="t">${esc(a.name)}</span><span class="s">In Cashew ${money(r2(a.file + a.skipped))}${a.skipped ? ", or " + money(a.file) + " without the " + money(Math.abs(a.skipped)) + " skipped as already here" : ""} · stored here ${money(a.here)}</span></span>
        <span class="r ${a.file === a.here ? "inc" : "exp"}">${a.file === a.here ? "✓ match" : "≠"}</span></div>`).join("")}</div>
      ${res.ok ? `<div class="msg ok">Checked after saving: all ${res.found} transactions are stored exactly once, and every account adds up to the same total as in Cashew.</div>`
        : res.kept && !res.twice ? `<div class="msg">The differences come from ${res.kept} transaction${res.kept === 1 ? "" : "s"} you changed or deleted in this app after an earlier import. They were kept as you left them.</div>`
        : `<div class="msg bad">Something doesn't add up${res.twice ? ` (${res.twice} transaction(s) appear twice)` : ""}. Nothing is lost: use Settings › Undo last import, and tell me what you see.</div>`}
    </div><div class="sh-foot"><button class="btn pri" data-a="mClose">Done</button></div></div>`);
}
async function cwPick(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".sql,.sqlite,.db,.csv,text/csv,application/octet-stream";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    snack("Reading " + esc(f.name) + "…");
    try {
      const head = new Uint8Array(await f.slice(0, 16).arrayBuffer());
      const isDb = String.fromCharCode(...head).startsWith("SQLite format 3");
      const N = isDb ? await cwFromDb(await f.arrayBuffer()) : cwFromCsv(await f.text());
      if (!N.txns.length) throw new Error("No transactions in that file.");
      document.querySelectorAll(".snack").forEach(s => s.remove());
      cwPreview(cwPlan(N), f.name);
    } catch(e){ snack(esc(e.message || String(e))); }
  };
  inp.click();
}
async function cwUndo(){
  const li = lastImport; if (!li) return;
  if (!await ask(`Undo the import of <b>${esc(li.file || "Cashew data")}</b>?<br><br>${li.created.length} added record(s) go away and ${li.prev.length} changed record(s) go back to how they were. Transactions you changed since then stay.`, "Undo import", true)) return;
  const t = now(), out = []; let keptN = 0;
  li.created.forEach(id => { const r = R.get(id); if (!r || r.del) return; if (r.kind === "txn" && (r.upd || 0) > (r.cwAt || 0)) { keptN++; return; } out.push(Object.assign({}, r, {del:1})); });
  li.prev.forEach(old => { const cur = R.get(old.id); if (cur && cur.kind === "txn" && (cur.upd || 0) > (cur.cwAt || 0)) { keptN++; return; } out.push(Object.assign({}, old)); });
  out.forEach(r => { const o = R.get(r.id); r.upd = Math.max(t, o ? (o.upd || 0) + 1 : 0); if (r.cw) r.cwAt = r.upd; R.set(r.id, r); dirty.add(r.id); });
  await Store.put(out); await Store.setMeta("dirty", [...dirty]);
  lastImport = null; await Store.setMeta("lastImport", null);
  Sync.soon(); render();
  snack("Import undone" + (keptN ? ". " + keptN + " you changed since were kept." : "."));
}

  if (id === "aNote") {
    // a note used before brings back its category and account (only when no category is picked yet)
    const n = e.target.value.trim().toLowerCase(); A.note = e.target.value;
    if (!n || A.type === "trf" || A.cat) return;
    const hit = txns().find(t => t.type === A.type && (t.note || "").trim().toLowerCase() === n && R.get(t.cat) && !R.get(t.cat).del);
    if (hit) { A.cat = hit.cat; A.sub = hit.sub || ""; A.subFor = null; if (R.get(hit.acc) && !R.get(hit.acc).del) A.acc = hit.acc; paintAdd(); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (menuEl) closeMenu(); else if (Modal.stack.length) Modal.close(); return; }
  const inField = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
  if (e.key === "Enter" && e.target.id === "aNote") { e.preventDefault(); e.target.blur(); return; }   // closes the phone keyboard
  if ($("addSheet") && Modal.stack.length === 1 && !inField) {
    const map = {Backspace:"bk", Enter:"ok", "+":"+", "-":"-", ".":".", ",":"."};
    const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (k && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); key(k); }
    return;
  }
  if (!Modal.stack.length && !inField && (e.key === "n" || e.key === "N" || e.key === "+") && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openAdd(); }
});

/* chart tooltips: hover on desktop, tap on phones */
const tip = $("tip");
let tipT;
function showTip(el){
  const r = el.getBoundingClientRect();
  const bars = [...el.querySelectorAll("i")].map(i => i.getBoundingClientRect().top);
  const top = bars.length ? Math.min(r.bottom, ...bars) : r.top + r.height / 2;
  tip.textContent = el.dataset.tip; tip.hidden = false; tip.className = "tip";
  tip.style.left = Math.min(innerWidth - 90, Math.max(90, r.left + r.width / 2)) + "px";
  tip.style.top = (top - 8) + "px";
}
document.addEventListener("pointerover", e => { const el = e.target.closest("[data-tip]"); if (el && e.pointerType === "mouse") showTip(el); });
document.addEventListener("pointerout", e => { if (e.pointerType === "mouse" && e.target.closest("[data-tip]")) tip.hidden = true; });
document.addEventListener("pointerup", e => {
  if (e.pointerType === "mouse" || e.target.closest("#lhit")) return;
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  showTip(el); clearTimeout(tipT); tipT = setTimeout(() => tip.hidden = true, 2500);
});
$("page").addEventListener("scroll", () => { tip.hidden = true; }, {passive:true});

/* home line chart: crosshair + values for the day under the finger/pointer */
function lineAt(e){
  const hit = e.target.closest("#lhit"); if (!hit || !lineData) return;
  const d = lineData, r = hit.getBoundingClientRect();
  const day = Math.max(1, Math.min(d.n, Math.round((e.clientX - r.left) / r.width * (d.n - 1)) + 1));
  const xh = $("lxh"); xh.hidden = false; xh.style.left = d.X(day) + "%";
  const lm = +d.key.slice(5) - 1, pm = +d.prevKey.slice(5) - 1;
  tip.textContent = (day <= d.tday ? day + " " + MON[lm] + ": " + money(d.cur[day]) + "\n" : "") + (day <= d.pn ? day + " " + MON[pm] + ": " + money(d.prev[day]) : "");
  tip.hidden = !tip.textContent; tip.className = "tip";
  tip.style.left = Math.min(innerWidth - 90, Math.max(90, r.left + d.X(day) / 100 * r.width)) + "px";
  tip.style.top = (r.top - 6) + "px";
}
document.addEventListener("pointermove", lineAt);
document.addEventListener("pointerdown", lineAt);
document.addEventListener("pointerout", e => { if (e.target.id === "lhit" && e.pointerType === "mouse") { tip.hidden = true; const x = $("lxh"); if (x) x.hidden = true; } });
document.addEventListener("pointerup", e => { if (e.target.id === "lhit" && e.pointerType !== "mouse") setTimeout(() => { tip.hidden = true; const x = $("lxh"); if (x) x.hidden = true; }, 1800); });

/* ═══════════════ start ═══════════════ */
(async function init(){
  await Store.init();
  (await Store.all()).forEach(r => R.set(r.id, r));
  if (!(await Store.meta("seeded", 0))) { await seedDefaults(); await Store.setMeta("seeded", 1); }
  dirty = new Set(await Store.meta("dirty", []));
  Sync.cursor = await Store.meta("cursor", 0);
  Sync.last = await Store.meta("lastSync", 0);
  lastImport = await Store.meta("lastImport", null);
  paintTheme();
  const h = location.hash.slice(1);
  if (h === "add") { history.replaceState(null, "", "#home"); show("home"); openAdd(); }
  else show(h || "home");
  Sync.soon(300);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (now() - Sync.last > 60e3) Sync.soon(200); if (!Modal.stack.length) render(); } });
  window.addEventListener("online", () => Sync.soon(200));
  setInterval(() => { if (document.visibilityState === "visible") Sync.run(); }, 5 * 60e3);
  setInterval(paintStatus, 60e3);
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1"))
    navigator.serviceWorker.register("./sw.js").catch(() => {});
})();
})();
</script>
